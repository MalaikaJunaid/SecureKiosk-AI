apiVersion: apps/v1
kind: Deployment
metadata:
  name: securekiosk-deployment
  labels:
    app: securekiosk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: securekiosk
  template:
    metadata:
      labels:
        app: securekiosk
    spec:
      containers:
      - name: securekiosk-api
        image: securekiosk-ai:latest
        imagePullPolicy: IfNotPresent  # Forces K8s to use your local Docker build
        ports:
        - containerPort: 8000
        resources:
          limits:
            memory: "2Gi"
            cpu: "1000m"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: securekiosk-service
spec:
  type: LoadBalancer
  selector:
    app: securekiosk
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000